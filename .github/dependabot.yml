# Dependabot opens pull requests for outdated dependencies. Security updates are separate (Settings > Advanced Security).
# Capacitor updates must also be synced into the native projects: after merging one, run `npm run sync` in game/
# and test the apps (see docs/testing.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /game
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      capacitor:
        patterns: ["@capacitor/*"]
      dev-tools:
        patterns: ["vite", "vitest", "typescript", "@types/*"]
      other:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: gradle
    directory: /game/android
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # Capacitor's Android template decides these versions. Gradle 9.6+ cannot run Android Gradle
      # Plugin 8 (the build fails), so skip major updates of both until Capacitor moves.
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
