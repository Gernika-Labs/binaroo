name: CI

on:
  push:
    branches: [main]
  pull_request:

# the repo default is read-only too; this keeps the workflow safe if that ever changes
permissions:
  contents: read

jobs:
  game:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      # the site embeds the web game at /play, so build the game first
      - run: npm ci
        working-directory: game
      - run: npm run build
        working-directory: game
      - run: npm test
        working-directory: site
      - run: npm run build
        working-directory: site

  # Builds the Android debug app. This is the only check that would have caught a Gradle or
  # Android plugin update that breaks the native build.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: game
      - run: npm run build
        working-directory: game
      # copies the web build into the Android project and generates the plugin wiring
      - run: npx cap sync android
        working-directory: game
      - run: ./gradlew assembleDebug
        working-directory: game/android
