<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07122b">
<title>Binaroo</title>
<script>try{var t=localStorage.getItem("binaroo:theme"),d=t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light"}catch(e){}</script>
</head>
<body>
<div id="app">
  <header>
    <div class="stat"><small>Score</small><b id="score">0</b></div>
    <div class="stat best"><small>Best</small><b id="best">0</b></div>
    <div class="stat lvl"><small id="lvlL">Level</small><b id="lvl">Easy</b></div>
    <div class="stat lvl"><small>Strikes</small><b id="strikes">○○○</b></div>
    <div class="sp"></div>
    <button class="ib" id="settingsBtn" aria-label="Settings">⚙︎</button>
    <button class="ib" id="pause" aria-label="Pause">II</button>
  </header>
  <div>
    <div id="board"><div class="grid pv-row" id="labels"></div><div class="grid" id="cells"></div></div>
  </div>
  <div class="tip" id="tip">Pick a shape, then drag or tap the board. Match a row's target exactly before its timer ends: 5 exact rows = next level. ✗ = impossible, a wrong bit is set.</div>
  <div id="tray"></div>
</div>
<div id="ghost"></div>
<div id="toast"></div>
<div class="lv" id="lvOv" hidden><div class="lvg" id="lvGrid"></div><div class="lvt"><div class="lvm" id="lvMsg"></div><div class="lvn" id="lvNum"></div><div class="lvs" id="lvName"></div></div></div>
<div class="ov" id="setOv" hidden role="dialog" aria-modal="true" aria-labelledby="setTitle"><div class="card">
  <h2 id="setTitle">Settings</h2>
  <div class="row"><span class="label">Theme</span>
    <div class="seg" id="themeSeg"><button data-choice="system">System</button><button data-choice="dark">Dark</button><button data-choice="light">Light</button></div></div>
  <div class="row"><span class="label">Sound</span><button class="toggle" id="soundBtn" aria-pressed="true">On</button></div>
  <div class="row" id="hapticRow" hidden><span class="label">Haptics</span><button class="toggle" id="hapticBtn" aria-pressed="true">On</button></div>
  <button class="btn" id="setClose">Done</button>
</div></div>
<div class="ov" id="pauseOv" hidden><div class="card"><h2>Paused</h2><button class="btn" id="resume">Resume</button><button class="btn alt" id="restartP">Restart</button></div></div>
<div class="ov" id="overOv" hidden><div class="card"><h2>Time's up</h2><div class="big" id="finalScore">0</div><p id="fact"></p><button class="btn" id="restart">Play again</button></div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
